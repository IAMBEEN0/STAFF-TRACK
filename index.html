<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d3b">
  <title>Committee Manager | کمیٹی منیجر</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Every screen is drawn into this box by app.js -->
  <div id="app"></div>

  <!-- Full-screen draw animation -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- Yes / No question box -->
  <div id="modal" class="overlay modal" hidden></div>

  <!-- Small message at the bottom of the screen -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p style="padding:1rem;font-size:1.2rem">Please turn on JavaScript in your browser. / براہ کرم براؤزر میں جاوا اسکرپٹ آن کریں۔</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
